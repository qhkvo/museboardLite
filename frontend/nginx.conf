server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 21m;
    location ^~ /api/internal/ { return 404; }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
