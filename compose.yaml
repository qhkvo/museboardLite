name: museboard-lite
services:
  db:
    build: ./database
    environment:
      POSTGRES_DB: museboard
      POSTGRES_USER: museboard
      POSTGRES_PASSWORD: museboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museboard -d museboard"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://museboard:museboard@db:5432/museboard
      STORAGE_DIR: /data
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in .env (see docs/phase3.md)}
    volumes:
      - image_data:/data
      - thumbnail_data:/data/thumbnails
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  cpu-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["--mode", "cpu"]
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in .env}
    volumes:
      - image_data:/data:ro
      - thumbnail_data:/data/thumbnails
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 2
  ai-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["--mode", "ai"]
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in .env}
    volumes:
      - image_data:/data:ro
      - ./models:/models:ro
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  image_data:
  thumbnail_data:
